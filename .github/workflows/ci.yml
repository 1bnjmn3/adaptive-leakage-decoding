# Continuous integration for the heralded-leakage decoding study.
# Ubuntu runners already provide g++ and CMake; do not apt-install them.

name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and test extras
        run: pip install -e ".[test]"

      - name: Build the C++ decoder
        run: cmake -S hw -B hw/build -DCMAKE_BUILD_TYPE=Release && cmake --build hw/build -j

      - name: Test the C++ decoder
        run: ctest --test-dir hw/build --output-on-failure

      - name: Run the test suite
        run: pytest -q

      - name: Run the quick benchmark
        run: leakdecode-bench --quick --out results-ci

      - name: Upload the quick-benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: results-ci-py${{ matrix.python-version }}
          path: results-ci
          if-no-files-found: error
