[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leakdecode"
version = "0.1.0"
description = "Adaptive (herald-aware) decoding of surface-code memory experiments under heralded-erasure leakage, with Stim + PyMatching."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ben Thelen" }]
dependencies = [
  "stim>=1.14",
  "pymatching>=2.2",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
leakdecode-bench = "leakdecode.bench:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
